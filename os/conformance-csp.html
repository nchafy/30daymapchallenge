<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS conformance under CSP &middot; not part of the site</title>
<meta name="robots" content="noindex">
<!--
  A strict policy, with no `data:` in `img-src`.

  This is the whole point of the page. `img-src` governs images loaded from CSS, not only
  from markup, so every icon that `os/desktop.css` draws as a `data:image/svg+xml`
  background is refused here: the element exists, its computed `background-image` is
  correct, and the box is blank.

  A consumer of this shell hit that on their own site and reported it. The two icons below
  are the measurement: the left one asks the stylesheet for its art and must come out
  blank, the right one carries its own node and must draw. `scripts/check.py` counts the
  pixels of each.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
<link rel="stylesheet" href="/os/theme.css">
<link rel="stylesheet" href="/os/desktop.css">
</head>
<body class="desktop">

<h1 class="visually-hidden">Icon art under a strict Content-Security-Policy</h1>

<ul id="icons" class="icon-grid" aria-label="Two icons, one per art mechanism"></ul>

<nav class="taskbar" aria-label="Nothing">
  <button type="button" class="start" id="start" aria-expanded="false" aria-controls="start-menu">start</button>
  <div class="task-items"></div>
  <div class="tray"><span id="clock"></span></div>
</nav>

<div class="start-menu" id="start-menu" hidden><ol></ol></div>

<script type="module" src="./conformance-csp.mjs"></script>
</body>
</html>
