<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS conformance &middot; not part of the site</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/os/theme.css">
</head>
<body>

<!--
  A host that is not this site, standing in for one.

  It server-renders its own taskbar — two plain links, so the bar works with no
  JavaScript — and mounts the shell for the clock, the panel and the close box only. It
  passes no `entries` and no `menu`.

  What this page exists to prove:

  1. `mountShell` with no `entries` does NOT touch `.task-items`. The previous version
     called `renderTaskbar` unconditionally, and because the open-window list was filtered
     against this project's own day catalogue, every other host's bar was silently
     emptied. "I have no windows to show" and "I was not asked to manage this bar" are
     different states.
  2. With no `menu`, the Start menu is left alone, so a host needs no catalogue at all for
     the import graph to resolve.
  3. The pieces a host does want still work.

  `scripts/check.py` drives it. The site does not link it.
-->

<div class="window">
  <div class="window-title">
    <h1>A host that is not the challenge</h1>
    <span class="spacer"></span>
    <div class="title-buttons">
      <button type="button" class="title-box close" id="window-close" aria-label="Close window">&#10005;</button>
    </div>
  </div>

  <div class="window-body">
    <p class="sheet" style="padding:1rem">
      This page is a fixture. It checks that the shell can be mounted by a site with its
      own navigation, without that navigation being replaced.
    </p>

    <aside class="detail" id="detail" aria-labelledby="detail-title" hidden>
      <div class="detail-head">
        <h2 id="detail-title"></h2>
        <button type="button" class="detail-close title-box close" aria-label="Close details">&#10005;</button>
      </div>
      <div class="detail-body"></div>
      <p class="detail-foot"></p>
    </aside>
  </div>

  <div class="window-status">
    <p class="map-attrib">A host's own status line.</p>
  </div>
</div>

<nav class="taskbar" aria-label="This host's own navigation">
  <button type="button" class="start" id="start" aria-expanded="false" aria-controls="start-menu">start</button>
  <!-- Server-rendered, and it must survive mountShell(). -->
  <div class="task-items">
    <span class="task-button"><a class="task-label" href="/os/conformance.html">Host page one</a></span>
    <span class="task-button"><a class="task-label" href="/os/conformance.html">Host page two</a></span>
  </div>
  <div class="tray"><span id="clock"></span></div>
</nav>

<div class="start-menu" id="start-menu" hidden>
  <div class="start-menu-head">This host has no menu entries</div>
  <ol></ol>
</div>

<script type="module" src="./conformance.mjs"></script>
</body>
</html>
