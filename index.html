<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 Day Map Challenge 2026</title>
<meta name="description" content="Thirty maps for the 30 Day Map Challenge, November 2026, on one Windows XP themed base map. Every day is an icon on the desktop.">
<link rel="stylesheet" href="/assets/xp.css">
<link rel="stylesheet" href="/assets/index.css">
</head>
<body class="desktop">

<h1 class="visually-hidden">30 Day Map Challenge, November 2026</h1>

<ul id="icons" class="icon-grid" aria-label="The base map and the thirty days">
  <!-- Filled by index.mjs from assets/days.mjs. Without JavaScript the desktop is empty,
       so the one link that always works is below it. -->
</ul>

<noscript>
  <p class="noscript-note">
    This desktop is drawn by a script. Without one, start at
    <a href="/days/00-base/">the base map</a>.
  </p>
</noscript>

<nav class="taskbar" aria-label="Open windows">
  <button type="button" class="start" id="start" aria-expanded="false" aria-controls="start-menu">start</button>
  <div class="task-items"></div>
  <div class="tray"><span id="clock"></span></div>
</nav>

<div class="start-menu" id="start-menu" hidden>
  <div class="start-menu-head">30 Day Map Challenge<small>1&ndash;30 November 2026</small></div>
  <ol></ol>
  <p class="start-menu-foot">Themes from 30daymapchallenge.com</p>
</div>

<script type="module" src="/assets/index.mjs"></script>
</body>
</html>
