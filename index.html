<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 Day Map Challenge 2026</title>
<meta name="description" content="Thirty maps for the 30 Day Map Challenge, November 2026, on one shared base map, in a Windows XP desktop.">

<!-- The shell, vendored. Three stylesheets because they have three subjects: the Luna
     palette and controls, the desktop and taskbar, the window frame. -->
<link rel="stylesheet" href="/vendor/webxp/theme.css">
<link rel="stylesheet" href="/vendor/webxp/shell.css">
<link rel="stylesheet" href="/vendor/webxp/window.css">

<!-- The map layer, which is this project's own. Neither theme may leak into the other;
     that split is a directory boundary now rather than a convention. -->
<link rel="stylesheet" href="/lib/map.css">
<link rel="stylesheet" href="/days/02-lines/lines.css">
</head>
<body>

<!-- The desktop is built in JavaScript, not written here. Windows are created and destroyed
     at runtime, so a desktop spelled out as markup would be a picture of one and the two
     copies would drift. -->
<div id="webxp"></div>

<noscript>
  <p class="noscript-note">
    This desktop is drawn by a script, and every map needs WebGL 2. Without either there is
    nothing to show.
  </p>
</noscript>

<script type="module" src="/boot.mjs"></script>
</body>
</html>
