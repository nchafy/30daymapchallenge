<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 02 &mdash; Lines &middot; 30 Day Map Challenge 2026</title>
<meta name="description" content="Day 02 of the 30 Day Map Challenge 2026: Lines. How much of a recorded GPS trace is noise, measured by simplifying it until the wobble is gone.">
<link rel="stylesheet" href="/assets/xp.css">
</head>
<body>

<div class="window">
  <div class="window-title">
    <svg class="window-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="7" fill="#3a6ea5" stroke="#dfe8f5" stroke-width="1"/>
      <path d="M1 8h14M8 1c2.5 2 2.5 12 0 14M8 1C5.5 3 5.5 13 8 15" fill="none" stroke="#dfe8f5" stroke-width="1"/>
    </svg>
    <h1>Day 02 &mdash; Lines</h1>
    <span class="spacer"></span>
    <div class="title-buttons">
      <span class="title-box is-decorative" aria-hidden="true">_</span>
      <span class="title-box is-decorative" aria-hidden="true">&#9633;</span>
      <button type="button" class="title-box close" id="window-close" aria-label="Close window">&#10005;</button>
    </div>
  </div>

  <div class="window-body">
    <div id="map" class="map"></div>

    <div class="overlays">
      <div class="card">
        <h2>Basemap</h2>
        <div class="layer-switch" role="group" aria-label="Which basemap to show">
          <button type="button" data-basemap="simple" aria-pressed="true">Simple</button>
          <button type="button" data-basemap="satellite" aria-pressed="false">Satellite</button>
          <button type="button" data-basemap="geography" aria-pressed="false">Geography</button>
        </div>
        <div class="tilt-row">
          <button type="button" id="map-tilt" aria-pressed="false">Tilt</button>
        </div>
      </div>

      <div class="card">
        <h2>Measuring stick</h2>
        <div class="trackbar">
          <label for="tolerance">Detail</label>
          <input type="range" id="tolerance" min="0" max="100" step="0.5" value="0"
                 aria-describedby="readout">
          <output for="tolerance" id="tolerance-out">0 m</output>
        </div>
        <p class="readout" id="readout"></p>
        <div class="key">
          <div><i style="border-top-color:#ff2e88"></i> <span id="key-recorded">as recorded</span></div>
          <div><i style="border-top-color:#39d0ff; border-top-style:solid"></i> <span>snapped to the map</span></div>
        </div>
        <div class="tilt-row">
          <button type="button" id="toggle-matched" aria-pressed="true">Snapped line</button>
        </div>
      </div>

      <p id="map-status" class="map-status" role="status" aria-live="polite"></p>
    </div>

    <div class="map-zoom">
      <button type="button" id="map-zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="map-zoom-out" aria-label="Zoom out">&#8722;</button>
      <button type="button" id="map-compass" aria-label="Facing north. Press to reset, arrow keys to turn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="34" height="34">
          <circle cx="12" cy="12" r="10.5" fill="none" stroke="#8a8a6a" stroke-width="1"/>
          <g id="map-compass-rose" transform="rotate(0 12 12)">
            <polygon points="12,2.5 15.2,12 12,9.8 8.8,12" fill="#c8341a"/>
            <polygon points="12,21.5 8.8,12 12,14.2 15.2,12" fill="#6b6b55"/>
          </g>
          <circle cx="12" cy="12" r="1.1" fill="#3a3a3a"/>
        </svg>
      </button>
    </div>

    <p id="map-attrib" class="map-attrib"></p>

    <aside class="detail" id="detail" aria-labelledby="detail-title" hidden>
      <div class="detail-head">
        <h2 id="detail-title"></h2>
        <button type="button" class="detail-close title-box close" aria-label="Close details">&#10005;</button>
      </div>
      <div class="detail-body"></div>
      <p class="detail-foot"></p>
    </aside>
  </div>
</div>

<nav class="taskbar" aria-label="Open windows">
  <button type="button" class="start" id="start" aria-expanded="false" aria-controls="start-menu">start</button>
  <!-- Filled by taskbar.mjs: one button per day the reader has open. -->
  <div class="task-items"></div>
  <div class="tray"><span id="clock"></span></div>
</nav>

<div class="start-menu" id="start-menu" hidden>
  <div class="start-menu-head">30 Day Map Challenge<small>1&ndash;30 November 2026</small></div>
  <ol></ol>
  <p class="start-menu-foot">Themes from 30daymapchallenge.com</p>
</div>

<script type="module" src="./map.mjs"></script>
</body>
</html>
