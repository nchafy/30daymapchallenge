<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base map &mdash; 30 Day Map Challenge 2026</title>
<meta name="description" content="A Windows XP themed base map with simple, satellite and geography layers, used as the starting point for every day of the 30 Day Map Challenge.">
<link rel="stylesheet" href="/assets/xp.css">
</head>
<body>

<!-- One maximised XP window. The shell below is what `days/_template/` carries: copy it,
     change the title, the taskbar label and the module at the bottom. -->
<div class="window">
  <div class="window-title">
    <!-- Inline SVG, not an image file: one request fewer, and a strict `img-src` has
         nothing to allow. -->
    <svg class="window-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="7" fill="#3a6ea5" stroke="#dfe8f5" stroke-width="1"/>
      <path d="M1 8h14M8 1c2.5 2 2.5 12 0 14M8 1C5.5 3 5.5 13 8 15" fill="none" stroke="#dfe8f5" stroke-width="1"/>
    </svg>
    <h1>Base map</h1>
    <span class="spacer"></span>
    <div class="title-buttons">
      <!-- Spans, not buttons: there is one window and nowhere to minimise it to, so these
           are decoration and stay out of the tab order. -->
      <span class="title-box is-decorative" aria-hidden="true">_</span>
      <span class="title-box is-decorative" aria-hidden="true">&#9633;</span>
      <button type="button" class="title-box close" id="window-close" aria-label="Close window">&#10005;</button>
    </div>
  </div>

  <div class="window-body">
    <div id="map" class="map"></div>

    <!-- Chrome floating on the canvas. The container ignores the pointer so drags reach the
         map; each card takes it back. -->
    <div class="overlays">
      <div class="card">
        <h2>Basemap</h2>
        <div class="layer-switch" role="group" aria-label="Which basemap to show">
          <button type="button" data-basemap="simple" aria-pressed="true">Simple</button>
          <button type="button" data-basemap="satellite" aria-pressed="false">Satellite</button>
          <button type="button" data-basemap="geography" aria-pressed="false">Geography</button>
        </div>
        <p id="hint">Click the map to read a coordinate.</p>
        <!-- The tilt gesture is ctrl-drag on a desktop, which nobody finds, so there is a
             button for it. It only moves the camera: the 3D buildings follow the angle,
             not the button, so dragging to an angle gives the same result. -->
        <div class="tilt-row">
          <button type="button" id="map-tilt" aria-pressed="false">Tilt</button>
          <span class="tilt-note">3D buildings show from an angle, past zoom 14.</span>
        </div>
      </div>
      <!-- Under the control card, in the same flex column, so it can never land on top of
           a control whose size changed. -->
      <p id="map-status" class="map-status" role="status" aria-live="polite"></p>
    </div>

    <!-- A map control belongs on the map, not in a card. The visible glyph is a symbol, so
         each button carries an aria-label: "+" is not a name. The minus is U+2212 MINUS
         SIGN, not a hyphen, so it matches the plus optically. -->
    <div class="map-zoom">
      <button type="button" id="map-zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="map-zoom-out" aria-label="Zoom out">&#8722;</button>
      <!-- Indicator and control in one, as a compass has always been. The rose turns with
           the map; pressing it faces north again. Focused, the arrow keys turn the view,
           which is the only way to rotate without a ctrl-drag or two fingers.
           The `g` is rotated through its SVG transform attribute, not a style attribute,
           so the needle keeps working under a strict `style-src`. -->
      <button type="button" id="map-compass" aria-label="Facing north. Press to reset, arrow keys to turn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="34" height="34">
          <circle cx="12" cy="12" r="10.5" fill="none" stroke="#8a8a6a" stroke-width="1"/>
          <g id="map-compass-rose" transform="rotate(0 12 12)">
            <!-- Red half is north, which needs no letter: it is the one convention every
                 compass rose has kept. -->
            <polygon points="12,2.5 15.2,12 12,9.8 8.8,12" fill="#c8341a"/>
            <polygon points="12,21.5 8.8,12 12,14.2 15.2,12" fill="#6b6b55"/>
          </g>
          <circle cx="12" cy="12" r="1.1" fill="#3a3a3a"/>
        </svg>
      </button>
    </div>

    <aside class="detail" id="detail" aria-labelledby="detail-title" hidden>
      <div class="detail-head">
        <h2 id="detail-title"></h2>
        <button type="button" class="detail-close title-box close" aria-label="Close details">&#10005;</button>
      </div>
      <div class="detail-body"></div>
      <p class="detail-foot"></p>
    </aside>
  </div>

  <!-- The window's status bar, and the only place the basemap credit lives.
       Every source requires attribution, which makes it a licence term rather than a
       nicety. Floated over the canvas it sat under the detail panel, which docks
       bottom-right and is a layer above — so the credit vanished whenever anything was
       selected. A status bar is outside the map entirely: nothing can cover it, at any
       viewport, and an XP window had one anyway. -->
  <div class="window-status">
    <p id="map-attrib" class="map-attrib"></p>
  </div>
</div>

<nav class="taskbar" aria-label="Challenge days">
  <button type="button" class="start" id="start" aria-expanded="false" aria-controls="start-menu">start</button>
  <div class="task-items">
    <span class="task-button">Base map</span>
  </div>
  <div class="tray"><span id="clock"></span></div>
</nav>

<div class="start-menu" id="start-menu" hidden>
  <div class="start-menu-head">30 Day Map Challenge<small>1&ndash;30 November 2026</small></div>
  <ol></ol>
  <p class="start-menu-foot">Themes from 30daymapchallenge.com</p>
</div>

<script type="module" src="./map.mjs"></script>
</body>
</html>
